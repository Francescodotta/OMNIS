services:
  frontend:
    build: .
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - REACT_APP_AUTH_API_URL=http://localhost:5000
      - REACT_APP_FLOW_CYTOMETRY_API_URL=http://localhost:5003  
      - REACT_APP_METABOLOMICS_URL=http://localhost:5001 
    volumes:
      - ./:/app
    networks:
      - omnis_network  # Usa una rete condivisa


networks:
  omnis_network:
    external: true
    name: omnis_network